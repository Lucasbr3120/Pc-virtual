name: Windows Cloud PC

on:
  workflow_dispatch:

jobs:
  cloud-pc:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Configurar RDP
        shell: powershell
        run: |
          Write-Host "Configurando RDP..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "RDP configurado."

      - name: Criar usuário administrador
        shell: powershell
        run: |
          Write-Host "Criando usuário administrador..."

          $chars = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%'

          $randomPart = -join (1..20 | ForEach-Object {
            $chars[(Get-Random -Maximum $chars.Length)]
          })

          $password = "Aa1!" + $randomPart

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name "cloudpc" `
            -Password $securePassword `
            -FullName "Cloud PC Administrator" `
            -Description "Cloud PC Administrator" `
            -PasswordNeverExpires `
            -AccountNeverExpires

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "cloudpc"

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "cloudpc"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "       CREDENCIAIS DO CLOUD PC"
          Write-Host "=========================================="
          Write-Host "Usuário: cloudpc"
          Write-Host "Senha:   $password"
          Write-Host "Permissão: ADMINISTRADOR"
          Write-Host "=========================================="

      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSSCALE_AUTH_KEY }}

      - name: Verificar Tailscale
        shell: powershell
        run: |
          Write-Host "Verificando conexão Tailscale..."

          $ip = tailscale ip -4

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          WINDOWS CLOUD PC"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "IP TAILSCALE:"
          Write-Host $ip
          Write-Host ""
          Write-Host "USUÁRIO:"
          Write-Host "cloudpc"
          Write-Host ""
          Write-Host "PERMISSÃO:"
          Write-Host "ADMINISTRADOR"
          Write-Host ""
          Write-Host "=========================================="

      - name: Descobrir localização do servidor
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "       LOCALIZAÇÃO DO SERVIDOR"
          Write-Host "=========================================="

          try {
            $ip = (Invoke-RestMethod -Uri "https://api.ipify.org").Trim()

            Write-Host "IP público: $ip"
            Write-Host ""

            $info = Invoke-RestMethod -Uri "https://ipwho.is/$ip"

            Write-Host "País:       $($info.country)"
            Write-Host "Região:     $($info.region)"
            Write-Host "Cidade:     $($info.city)"
            Write-Host "Continente: $($info.continent)"
            Write-Host "ISP:        $($info.connection.isp)"
          }
          catch {
            Write-Host "Não foi possível obter a localização."
            Write-Host $_.Exception.Message
          }

          Write-Host ""
          Write-Host "=========================================="

      - name: Verificar administrador
        shell: powershell
        run: |
          Write-Host "Verificando permissões..."

          $members = Get-LocalGroupMember -Group "Administrators"

          $admin = $members | Where-Object {
            $_.Name -like "*\cloudpc"
          }

          if ($admin) {
            Write-Host ""
            Write-Host "cloudpc é ADMINISTRADOR."
          }
          else {
            Write-Error "cloudpc não está no grupo Administrators."
            exit 1
          }

      - name: Manter Cloud PC ligado
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "Cloud PC está funcionando."
          Write-Host "Não encerre este workflow enquanto estiver usando."
          Write-Host ""

          while ($true) {
            Write-Host "Cloud PC ativo - $(Get-Date)"
            Start-Sleep -Seconds 60
          }
