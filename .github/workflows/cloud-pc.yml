name: Windows Cloud PC

on:
  workflow_dispatch:

jobs:
  cloud-pc:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      # ==============================
      # CONFIGURAR RDP
      # ==============================
      - name: Configurar RDP
        shell: powershell
        run: |
          Write-Host "Configurando RDP..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Start-Service -Name TermService

          Write-Host "RDP configurado."

      # ==============================
      # CRIAR USUÁRIO RDP
      # ==============================
      - name: Criar usuário RDP
        shell: powershell
        run: |
          Write-Host "Criando usuário..."

          $chars = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%'

          $randomPart = -join (1..20 | ForEach-Object {
            $chars[(Get-Random -Maximum $chars.Length)]
          })

          $password = "Aa1!" + $randomPart

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name "cloudpc" `
            -Password $securePassword `
            -FullName "Cloud PC" `
            -Description "Cloud PC RDP User" `
            -PasswordNeverExpires `
            -AccountNeverExpires

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "cloudpc"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          CREDENCIAIS RDP"
          Write-Host "=========================================="
          Write-Host "Usuário: cloudpc"
          Write-Host "Senha:   $password"
          Write-Host "=========================================="

      # ==============================
      # CONECTAR AO TAILSCALE
      # ==============================
      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSSCALE_AUTH_KEY }}

      # ==============================
      # MOSTRAR IP DO TAILSCALE
      # ==============================
      - name: Mostrar endereço do Cloud PC
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          WINDOWS CLOUD PC"
          Write-Host "=========================================="
          Write-Host ""

          $ip = tailscale ip -4

          Write-Host "IP TAILSCALE:"
          Write-Host $ip

          Write-Host ""
          Write-Host "USUÁRIO:"
          Write-Host "cloudpc"

          Write-Host ""
          Write-Host "=========================================="

      # ==============================
      # DESCOBRIR LOCALIZAÇÃO DA VM
      # ==============================
      - name: Descobrir localização do servidor
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "       LOCALIZAÇÃO DO SERVIDOR"
          Write-Host "=========================================="

          try {
            $ip = (Invoke-RestMethod `
              -Uri "https://api.ipify.org").Trim()

            Write-Host "IP público: $ip"
            Write-Host ""

            $info = Invoke-RestMethod `
              -Uri "https://ipwho.is/$ip"

            Write-Host "País:       $($info.country)"
            Write-Host "Região:     $($info.region)"
            Write-Host "Cidade:     $($info.city)"
            Write-Host "Continente: $($info.continent)"
            Write-Host "ISP:        $($info.connection.isp)"

          }
          catch {
            Write-Host "Não foi possível obter a localização."
            Write-Host $_.Exception.Message
          }

          Write-Host ""
          Write-Host "=========================================="

      # ==============================
      # MANTER VM LIGADA
      # ==============================
      - name: Manter Cloud PC ligado
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "Cloud PC está funcionando."
          Write-Host "Não encerre este workflow enquanto estiver usando."
          Write-Host ""

          while ($true) {
            Write-Host "Cloud PC ativo - $(Get-Date)"
            Start-Sleep -Seconds 60
          }      # MANTER VM LIGADA
      # ==============================
      - name: Manter Cloud PC ligado
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "Cloud PC está funcionando."
          Write-Host ""

          while ($true) {
            Write-Host "Cloud PC ativo - $(Get-Date)"
            Start-Sleep -Seconds 60
          }          Write-Host "=========================================="
          Write-Host "Use esse IP no aplicativo de Área de"
          Write-Host "Trabalho Remota do seu celular."
          Write-Host "=========================================="

      # ==============================
      # MANTER A VM LIGADA
      # ==============================
      - name: Manter Cloud PC ligado
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "Cloud PC está funcionando."
          Write-Host "Não encerre este workflow enquanto estiver usando."
          Write-Host ""

          while ($true) {
            Write-Host "Cloud PC ativo - $(Get-Date)"
            Start-Sleep -Seconds 60
          }
          Write-Host "Aguardando ngrok iniciar..."

          $started = $false

          for ($i = 1; $i -le 30; $i++) {

            Start-Sleep -Seconds 2

            Write-Host "Tentativa $i/30..."

            try {
              $tunnels = Invoke-RestMethod `
                -Uri "http://127.0.0.1:4040/api/tunnels" `
                -TimeoutSec 3

              $started = $true
              break
            }
            catch {
              Write-Host "API ainda não disponível."
            }
          }

          if (!$started) {

            Write-Host ""
            Write-Host "=========================================="
            Write-Host "LOG DO NGROK"
            Write-Host "=========================================="

            if (Test-Path $logFile) {
              Get-Content $logFile
            }
            else {
              Write-Host "Log não encontrado."
            }

            exit 1
          }

          $tunnel = $tunnels.tunnels |
            Where-Object { $_.proto -eq "tcp" } |
            Select-Object -First 1

          if ($null -eq $tunnel) {
            Write-Error "Nenhum túnel TCP foi encontrado."
            Get-Content $logFile
            exit 1
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "       WINDOWS CLOUD PC"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "ENDEREÇO RDP:"
          Write-Host $tunnel.public_url
          Write-Host ""
          Write-Host "USUÁRIO:"
          Write-Host "cloudpc"
          Write-Host ""
          Write-Host "=========================================="

      - name: Manter Cloud PC ligado
        shell: powershell
        run: |
          Write-Host "Cloud PC está funcionando."

          while ($true) {
            Write-Host "Cloud PC ativo - $(Get-Date)"
            Start-Sleep -Seconds 60
          }
