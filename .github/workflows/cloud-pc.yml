name: Windows Cloud PC

on:
  workflow_dispatch:

jobs:
  cloud-pc:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      - name: Configurar RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

      - name: Criar usuário
        shell: powershell
        run: |
          $password = ConvertTo-SecureString "CloudPC@2026!" -AsPlainText -Force

          New-LocalUser `
            -Name "cloudpc" `
            -Password $password `
            -FullName "Cloud PC" `
            -PasswordNeverExpires

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "cloudpc"

      - name: Instalar ngrok
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" `
            -OutFile "$env:TEMP\ngrok.zip"

          Expand-Archive `
            "$env:TEMP\ngrok.zip" `
            -DestinationPath "$env:TEMP\ngrok" `
            -Force

      - name: Configurar ngrok
        shell: powershell
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          & "$env:TEMP\ngrok\ngrok.exe" config add-authtoken "$env:NGROK_AUTH_TOKEN"

      - name: Iniciar túnel RDP
        shell: powershell
        run: |
          Start-Process `
            -FilePath "$env:TEMP\ngrok\ngrok.exe" `
            -ArgumentList "tcp 3389" `
            -WindowStyle Hidden

          Start-Sleep -Seconds 5

          Write-Host ""
          Write-Host "======================================"
          Write-Host "       WINDOWS CLOUD PC"
          Write-Host "======================================"
          Write-Host ""

          Write-Host "Endpoint ngrok:"
          Invoke-RestMethod http://127.0.0.1:4040/api/tunnels |
            Select-Object -ExpandProperty tunnels |
            Select-Object public_url

      - name: Manter PC funcionando
        shell: powershell
        run: |
          while ($true) {
            Write-Host "Cloud PC ativo - $(Get-Date)"
            Start-Sleep -Seconds 60
          }
