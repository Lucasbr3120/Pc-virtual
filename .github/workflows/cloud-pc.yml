name: Windows Cloud PC

on:
  workflow_dispatch:

jobs:
  cloud-pc:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      # ==============================
      # CONFIGURAR RDP
      # ==============================
      - name: Configurar RDP
        shell: powershell
        run: |
          Write-Host "Configurando RDP..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "RDP configurado."

      # ==============================
      # CRIAR USUÁRIO
      # ==============================
      - name: Criar usuário RDP
        shell: powershell
        run: |
          Write-Host "Gerando senha..."

          $chars = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%'

          $randomPart = -join (1..20 | ForEach-Object {
            $chars[(Get-Random -Maximum $chars.Length)]
          })

          $password = "Aa1!" + $randomPart

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name "cloudpc" `
            -Password $securePassword `
            -FullName "Cloud PC" `
            -Description "Cloud PC RDP User" `
            -PasswordNeverExpires `
            -AccountNeverExpires

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "cloudpc"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          CREDENCIAIS RDP"
          Write-Host "=========================================="
          Write-Host "Usuário: cloudpc"
          Write-Host "Senha:   $password"
          Write-Host "=========================================="

      # ==============================
      # BAIXAR NGROK
      # ==============================
      - name: Baixar ngrok
        shell: powershell
        run: |
          $url = "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip"

          $zip = "$env:TEMP\ngrok.zip"
          $dir = "$env:TEMP\ngrok"

          Write-Host "Baixando ngrok..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $zip

          Expand-Archive `
            -Path $zip `
            -DestinationPath $dir `
            -Force

          Write-Host "ngrok instalado."

      # ==============================
      # CONFIGURAR NGROK
      # ==============================
      - name: Configurar ngrok
        shell: powershell
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NGROK_AUTH_TOKEN)) {
            Write-Error "NGROK_AUTH_TOKEN não foi configurado."
            exit 1
          }

          & "$env:TEMP\ngrok\ngrok.exe" `
            config add-authtoken `
            "$env:NGROK_AUTH_TOKEN"

          Write-Host "ngrok configurado."

      # ==============================
      # INICIAR NGROK
      # ==============================
      - name: Iniciar túnel RDP
        shell: powershell
        run: |
          $ngrok = "$env:TEMP\ngroK\ngrok.exe"

          if (!(Test-Path $ngrok)) {
            $ngrok = "$env:TEMP\ngrok\ngrok.exe"
          }

          Start-Process `
            -FilePath $ngrok `
            -ArgumentList "tcp 3389" `
            -WindowStyle Hidden

          Write-Host "Aguardando ngrok iniciar..."
          Start-Sleep -Seconds 10

          $tunnels = Invoke-RestMethod `
            -Uri "http://127.0.0.1:4040/api/tunnels"

          $tunnel = $tunnels.tunnels |
            Where-Object { $_.proto -eq "tcp" } |
            Select-Object -First 1

          if ($null -eq $tunnel) {
            Write-Error "O túnel ngrok não foi encontrado."
            exit 1
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          WINDOWS CLOUD PC"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "ENDEREÇO RDP:"
          Write-Host $tunnel.public_url
          Write-Host ""
          Write-Host "USUÁRIO:"
          Write-Host "cloudpc"
          Write-Host ""
          Write-Host "=========================================="

      # ==============================
      # MANTER VM LIGADA
      # ==============================
      - name: Manter Cloud PC ligado
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "Cloud PC está funcionando."
          Write-Host "Não encerre este workflow enquanto estiver usando."
          Write-Host ""

          while ($true) {
            Write-Host "Cloud PC ativo - $(Get-Date)"
            Start-Sleep -Seconds 60
          }
